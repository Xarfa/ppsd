# ===========================================================================
# PPSD 改版 —— 给服务器管理员（有 root）的 Apache 配置片段
#
# 位置：/etc/apache2/sites-enabled/000-default.conf 的 </VirtualHost> 之前
# 改完执行：apachectl graceful
#
# 做什么：把 http://202.195.250.119/PPSD_new/ 整站转交给
#         wjj 家目录里跑的 Node 进程（localhost:3618）。
#         页面和接口都由这一个 Node 进程提供，所以只需要这一段。
# ===========================================================================

<Location "/PPSD_new">
    ProxyPreserveHost On
    ProxyPass http://localhost:3618/
    ProxyPassReverse http://localhost:3618/
</Location>

# ---------------------------------------------------------------------------
# 逐行说明（不用抄进配置文件，这里是给看的人解释）
#
# <Location "/PPSD_new">
#     只对 URL 以 /PPSD_new 开头的请求生效，其他站（SmartRice2、RiceData...）
#     完全不受影响。
#
# ProxyPreserveHost On
#     转发时保留浏览器原本请求的 Host（202.195.250.119），
#     与服务器上 SmartRice2/RiceData 的写法保持一致。
#
# ProxyPass http://localhost:3618/
#     把 /PPSD_new 这段前缀替换成 / 再转发给本机 3618 端口。例如：
#       /PPSD_new/              → http://localhost:3618/
#       /PPSD_new/assets/a.js   → http://localhost:3618/assets/a.js
#       /PPSD_new/api/loci      → http://localhost:3618/api/loci
#
# ProxyPassReverse http://localhost:3618/
#     如果后端返回重定向（Location 头），把里面的地址改回 /PPSD_new 前缀，
#     否则浏览器会被带到 http://202.195.250.119/assets/... 这种错误地址。
# ---------------------------------------------------------------------------

# ===========================================================================
# 备选方案（如果管理员更希望静态文件由 Apache 直接发、只反代接口）
#
# 需要管理员额外建目录：mkdir -p /home/www/html/PPSD_new && chown wjj:wjj /home/www/html/PPSD_new
# 然后把 dist 解压进去，配置改成：
#
# <Directory "/home/www/html/PPSD_new">
#     DirectoryIndex index.html
#     FallbackResource "/PPSD_new/index.html"
# </Directory>
# <Location "/PPSD_new/api">
#     ProxyPreserveHost On
#     ProxyPass http://localhost:3618/api
#     ProxyPassReverse http://localhost:3618/api
# </Location>
#
# 两者对前端构建产物的要求相同（base=/PPSD_new/），可以随时切换。
# ===========================================================================
